name: terraform-ci

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate (no backend, no credentials)
        working-directory: environments/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      # soft_fail while you work through the findings; flip to false once clean.
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true

  plan:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required to request the OIDC token
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
      - name: Debug (remove afterwards)
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          echo "role=[${{ vars.AWS_PLAN_ROLE_ARN }}]"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | python3 -c "
          import sys, base64, json
          s = sys.stdin.read().strip(); s += '=' * (-len(s) % 4)
          c = json.loads(base64.urlsafe_b64decode(s))
          print(json.dumps({k: c[k] for k in ('iss','aud','sub')}, indent=2))"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform plan
        shell: bash
        working-directory: environments/dev
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt
          {
            echo '### Terraform plan (dev)'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
